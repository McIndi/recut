name: Promotion policy
on:
  pull_request:
permissions:
  contents: read
jobs:
  promotion:
    runs-on: ubuntu-24.04
    container: python:3.12-slim-bookworm@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce promotion source
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: python .github/scripts/promotion.py "$BASE_BRANCH" "$HEAD_BRANCH" "$HEAD_REPO" "$BASE_REPO"
